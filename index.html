    <script>
      // Early suppression of benign WebSocket / HMR notifications in sandboxed environments
      (function() {
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : String(a); }).join(' ');
          if (str.includes('websocket') || str.includes('WebSocket') || str.includes('not-allowed') || str.includes('Speech recognition warning')) return;
          origWarn.apply(console, arguments);
        };
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : String(a); }).join(' ');
          if (str.includes('websocket') || str.includes('WebSocket') || str.includes('closed without opened') || str.includes('failed to connect')) return;
          origError.apply(console, arguments);
        };
      })();
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('websocket') ||
          msg.includes('Socket closed') ||
          msg.includes('closed without opened')
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || String(event))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('websocket') ||
          msg.includes('Socket closed') ||
          msg.includes('closed without opened')
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
